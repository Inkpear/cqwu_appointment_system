services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: cqwu-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cqwu}
      MYSQL_USER: ${DB_USERNAME:-cqwu}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    cpus: ${MYSQL_CPUS:-2.0}
    mem_limit: ${MYSQL_MEM_LIMIT:-4g}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: cqwu-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change_me}"]
    volumes:
      - redis_data:/data
    cpus: ${REDIS_CPUS:-0.3}
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-change_me} ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: cqwu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cqwu}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_me}
    ports:
      - "${MINIO_DATA_PUBLIC_PORT:-1900}:9000"
    volumes:
      - minio_data:/data
    cpus: ${MINIO_CPUS:-0.8}
    mem_limit: ${MINIO_MEM_LIMIT:-1536m}

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    container_name: cqwu-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-cqwu} ${MINIO_SECRET_KEY:-change_me}; do
          echo 'waiting for minio...';
          sleep 2;
        done;
        mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-cqwu-appointment};
        echo 'minio bucket ensured: ${MINIO_BUCKET_NAME:-cqwu-appointment}';

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE_NAME:-cqwu-appointment-system}:${APP_IMAGE_TAG:-latest}
    pull_policy: never
    container_name: cqwu-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-8081}:${SERVER_PORT:-8081}"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8081}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-cqwu}
      DB_USERNAME: ${DB_USERNAME:-cqwu}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:1900}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-cqwu}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change_me}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-cqwu-appointment}
      JWT_SECRET: ${JWT_SECRET:-PLEASE_REPLACE_WITH_A_STRONG_SECRET_BASE64}
      JWT_ACCESS_TOKEN_EXPIRE_TIME: ${JWT_ACCESS_TOKEN_EXPIRE_TIME:-2H}
      JWT_REFRESH_TOKEN_EXPIRE_TIME: ${JWT_REFRESH_TOKEN_EXPIRE_TIME:-7D}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
      TZ: ${APP_TIME_ZONE:-Asia/Shanghai}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:80,http://127.0.0.1:80}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,DELETE,PATCH,OPTIONS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Authorization,Content-Type,X-Requested-With}
      CORS_EXPOSED_HEADERS: ${CORS_EXPOSED_HEADERS:-Authorization,Content-Disposition}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      CORS_MAX_AGE_SECONDS: ${CORS_MAX_AGE_SECONDS:-3600}
      LOG_PATH: ${LOG_PATH:-./logs/cqwu_appointment_system}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms768m -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:+HeapDumpOnOutOfMemoryError -Duser.timezone=Asia/Shanghai}
    cpus: ${APP_CPUS:-2.2}
    mem_limit: ${APP_MEM_LIMIT:-3g}

  frontend:
    image: ${FRONTEND_IMAGE_NAME:-cqwu-appointment-frontend}:${FRONTEND_IMAGE_TAG:-latest}
    pull_policy: never
    container_name: cqwu-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PUBLIC_PORT:-80}:80"
    cpus: ${FRONTEND_CPUS:-1.2}
    mem_limit: ${FRONTEND_MEM_LIMIT:-2g}

volumes:
  mysql_data:
  redis_data:
  minio_data:
