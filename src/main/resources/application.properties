spring.application.name=cqwu_appointment_system

# 日志配置
logging.file.path=./logs/cqwu_appointment_system

# 配置服务端口
server.port=8081

# ===================================================================
# 1. MySQL 数据源配置 (供 JPA 使用)
# ===================================================================
# 数据库连接 URL - MySQL 8.0 兼容配置
spring.datasource.url=jdbc:mysql://192.168.31.199:3306/cqwu?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
# 数据库用户名
spring.datasource.username=root
# 数据库密码
spring.datasource.password=admin123

# Hikari 连接池配置（可选，提升性能）
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ===================================================================
# 2. JPA / Hibernate 配置
# ===================================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===================================================================
# 2.1 MyBatis 配置
# ===================================================================
# 开启下划线转驼峰命名规则映射
mybatis.configuration.map-underscore-to-camel-case=true

# ===================================================================
# 3. Redis 配置
# ===================================================================
spring.data.redis.host=192.168.31.199
spring.data.redis.port=6379
spring.data.redis.password=admin123
spring.data.redis.database=0

# 安全相关
jwt.secret=iLos6YeFV6m1qjFLpck9IvthnqkJr0ZIPnD6T5ldmFc=
jwt.access-token-expire-time=1D
jwt.refresh-token-expire-time=1D
jwt.header=Authorization

#日志
# 每个用户允许存储在数据库中的最大前端日志条数
logging.frontend.max-per-user=20

# ===================================================================
# 4. SSE 心跳配置（自适应）
# ===================================================================
# SSE 会话存活时间（服务端 SseEmitter 超时时间）
# logging.sse.life=PT30M

# 心跳基础间隔（base）。调度采用：next = max(base, lastCost * P)，并受 max 上限约束。
logging.sse.heartbeat.base=PT25S

# 心跳倍率 P，用于自适应：computedDelay = lastCost * P
logging.sse.heartbeat.multiplier=1.0

# 心跳最大间隔（上限）。为避免客户端或中间代理误判掉线，建议保持 <= PT45S。
logging.sse.heartbeat.max=PT45S

# 广播抖动（平滑全员同时拉取）
logging.sse.broadcast.jitter.enabled=true
logging.sse.broadcast.jitter.max=PT3S

# 广播分批（进一步平滑大规模同时刷新）
logging.sse.broadcast.batch.enabled=true
logging.sse.broadcast.batch.size=50
logging.sse.broadcast.batch.gap=300ms
logging.sse.broadcast.batch.within-jitter=200ms

# ===================================================================
# 4. MinIO 对象存储配置
# ===================================================================
# MinIO 服务端点地址
minio.endpoint=http://192.168.31.199:9000

# MinIO 访问密钥
minio.access-key=root

# MinIO 密钥
minio.secret-key=admin123

# MinIO 存储桶名称
minio.bucket-name=cqwu-appointment

# ===================================================================
# 5. 文件上传配置
# ===================================================================
# 文件大小限制（字节）：20MB
file.upload.max-file-size=20971520

# 预签名URL有效期（分钟）
file.upload.presigned-url-expiry-minutes=5

# 单个预约最大附件数量
file.upload.max-attachments-per-reservation=10

# 允许的文件扩展名（逗号分隔）
file.upload.allowed-extensions=.jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar,.7z,.tar,.tar.gz,.gz,.bz2