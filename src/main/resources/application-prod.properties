# =========================
# Production Profile
# 通过环境变量注入，避免硬编码
# =========================

# 服务与线程模型（8C16G 单机混部）
server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=framework
server.tomcat.threads.max=160
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=150
server.tomcat.max-connections=4096
server.compression.enabled=true
server.compression.min-response-size=2KB
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,text/javascript,application/javascript

# 数据源
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:cqwu}?serverTimezone=${DB_SERVER_TIMEZONE:Asia/Shanghai}&connectionTimeZone=${DB_SERVER_TIMEZONE:Asia/Shanghai}&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME:cqwu}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.minimum-idle=6
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=${DB_SERVER_TIMEZONE:Asia/Shanghai}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JSON 时间序列化统一为 UTC+8
spring.jackson.time-zone=${APP_TIME_ZONE:Asia/Shanghai}

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true

# Redis
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:change_me}
spring.data.redis.database=0
spring.data.redis.timeout=5s
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=4
spring.data.redis.lettuce.pool.max-wait=3s

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://127.0.0.1:1900}
minio.access-key=${MINIO_ACCESS_KEY:change_me}
minio.secret-key=${MINIO_SECRET_KEY:change_me}
minio.bucket-name=${MINIO_BUCKET_NAME:cqwu-appointment}

# 安全
jwt.secret=${JWT_SECRET:PLEASE_REPLACE_WITH_A_STRONG_SECRET_BASE64}
jwt.access-token-expire-time=${JWT_ACCESS_TOKEN_EXPIRE_TIME:2H}
jwt.refresh-token-expire-time=${JWT_REFRESH_TOKEN_EXPIRE_TIME:7D}
jwt.header=Authorization

# CAS（统一认证）
cas.enabled=${CAS_ENABLED:true}
cas.server-url-prefix=${CAS_SERVER_URL_PREFIX:https://authserver.cqwu.edu.cn/authserver}
cas.server-login-url=${CAS_SERVER_LOGIN_URL:https://authserver.cqwu.edu.cn/authserver/login}
cas.server-logout-url=${CAS_SERVER_LOGOUT_URL:https://authserver.cqwu.edu.cn/authserver/logout}
cas.client-service-url=${CAS_CLIENT_SERVICE_URL:https://math-bookingroom.cqwu.edu.cn/api/auth/cas/callback}
cas.frontend-redirect-url=${CAS_FRONTEND_REDIRECT_URL:https://math-bookingroom.cqwu.edu.cn/login/callback}
cas.state-ttl=${CAS_STATE_TTL:PT5M}
cas.code-ttl=${CAS_CODE_TTL:PT2M}
cas.encoding=${CAS_ENCODING:UTF-8}

# CORS（生产白名单）
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://math-bookingroom.cqwu.edu.cn,http://localhost:80,http://127.0.0.1:80,https://localhost,https://127.0.0.1}
security.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.cqwu.edu.cn,http://localhost:*,http://127.0.0.1:*}
security.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
security.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With}
security.cors.exposed-headers=${CORS_EXPOSED_HEADERS:Authorization,Content-Disposition}
security.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}
security.cors.max-age-seconds=${CORS_MAX_AGE_SECONDS:3600}

# 日志（生产）
logging.file.path=${LOG_PATH:./logs/cqwu_appointment_system}
logging.frontend.max-per-user=${FRONTEND_LOG_MAX_PER_USER:50}
logging.level.root=INFO
logging.level.com.cqwu=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# SSE（生产建议）
logging.sse.heartbeat.base=${SSE_HEARTBEAT_BASE:PT25S}
logging.sse.heartbeat.multiplier=${SSE_HEARTBEAT_MULTIPLIER:1.0}
logging.sse.heartbeat.max=${SSE_HEARTBEAT_MAX:PT45S}
logging.sse.broadcast.jitter.enabled=${SSE_BROADCAST_JITTER_ENABLED:true}
logging.sse.broadcast.jitter.max=${SSE_BROADCAST_JITTER_MAX:PT3S}
logging.sse.broadcast.batch.enabled=${SSE_BROADCAST_BATCH_ENABLED:true}
logging.sse.broadcast.batch.size=${SSE_BROADCAST_BATCH_SIZE:80}
logging.sse.broadcast.batch.gap=${SSE_BROADCAST_BATCH_GAP:200ms}
logging.sse.broadcast.batch.within-jitter=${SSE_BROADCAST_BATCH_WITHIN_JITTER:120ms}

# 文件上传
file.upload.max-file-size=${FILE_UPLOAD_MAX_FILE_SIZE:20971520}
file.upload.presigned-url-expiry-minutes=${FILE_UPLOAD_PRESIGNED_URL_EXPIRY_MINUTES:5}
file.upload.max-attachments-per-reservation=${FILE_UPLOAD_MAX_ATTACHMENTS_PER_RESERVATION:10}
file.upload.allowed-extensions=.jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar,.7z,.tar,.tar.gz,.gz,.bz2
